[project]
name = "nbatotals"
version = "0.1.0"
description = "Transparent pace x efficiency NBA totals engine with an honest walk-forward harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyarrow>=14"]
legacy = ["pyarrow>=14"]  # maintainer-only: reads the private parquet lake (Experiment 2)

[tool.setuptools.packages.find]
include = ["nbatotals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
