# nbatotals parameters. Every number the engine uses lives here.
#
# "Fitted" means the walk-forward harness (Phase 3) re-chooses the value for
# each test season using only earlier seasons, by minimising the RMSE of the
# projected vs actual total (never betting results). The values below are the
# untouched defaults: they are starting points, not estimates from data.
# "Fixed" means the harness never changes it; change it yourself if your own
# research says so, and re-run the backtest.

features:
  # Weights for blending a team's last 3 games, last 10 games and
  # season-to-date. Must sum to 1. Windows only ever use games dated strictly
  # before the game being projected, and only from the same season.
  # Fitted.
  blend:
    l3: 0.3
    l10: 0.5
    season: 0.2

  # Shrinkage count: the blended team stat is pulled towards the prior as if
  # the prior were worth this many games. final = (n*blend + k*prior) / (n + k),
  # where n is the team's games played this season before the game date.
  # With n = 0 (opening night) the team is exactly the prior. Fitted.
  team_shrinkage_games: 5

  # Weight on a team's own previous-season rating in its early-season prior.
  # 0 means every team starts the season at the league average and nothing
  # from last season reaches a team's numbers. prior = w * last_season_team
  # + (1 - w) * league. Fixed (not in the pre-registered fitted set).
  team_carryover_weight: 0.0

  # If true, a home team's stats use only its earlier home games and an away
  # team's only its earlier away games. Fixed.
  home_away_split: false

league:
  # The league averages (pace, points per 100 possessions) that team stats
  # are measured against and shrunk towards. Each is the season-to-date
  # league average from games dated strictly before the game, shrunk towards
  # a base value as if the base were worth `shrinkage_team_games` team-games.
  # Fixed.
  shrinkage_team_games: 30

  # Base value for the league average:
  #   previous_season: the previous season's full league average (known before
  #                    the season starts), falling back to the constants below
  #                    when the store has no earlier season;
  #   constant:        always the constants below.
  # Fixed.
  prior_source: previous_season

  # Fallback constants. Rough values for the modern NBA, used only when no
  # earlier season is available (in the legacy backtest: opening weeks of
  # 2021-22, which is a training season, never a test season). Fixed.
  fallback_pace: 99.0
  fallback_ortg: 112.0

projection:
  # pace_proj = league_pace + pace_weight * ((home_pace - league_pace)
  #                                          + (away_pace - league_pace))
  # 1.0 is the usual additive rule (each team's pace deviation adds up);
  # 0.5 averages the two deviations. Fitted.
  pace_weight: 1.0

  # off_home = league_ortg + off_weight * (home_ortg - league_ortg)
  #                        + def_weight * (away_drtg - league_ortg)
  # and the same for the away side. 1.0/1.0 is the additive matchup rule.
  # Fixed: the pre-registration does not fit these.
  off_weight: 1.0
  def_weight: 1.0

  # Points added to every projected total. Every game has a home team, so
  # this also acts as the formula's constant term. 0 = no adjustment. Fitted.
  home_court_total: 0.0

  # Points added to the total for each team playing the second night of a
  # back-to-back (0, 1 or 2 teams per game). 0 = no adjustment. Fitted.
  b2b_total_per_team: 0.0

market:
  # Pre-registered in docs/PREREGISTRATION.md; changing these after seeing
  # results invalidates the comparison.
  outlier_points: 10      # drop a book whose line is this far from the cross-book median
  min_books: 3            # books needed (after the outlier rule) to score a game at an anchor

ingest:
  theodds:
    sport: basketball_nba
    # Book regions to request (comma-separated: us, us2, uk, eu, au). Each
    # region multiplies the credit cost of an odds call.
    regions: us
    # Markets to store. Only totals feed the model; spreads and h2h are kept so
    # you never need to refetch. Each market multiplies the credit cost.
    markets: totals,spreads,h2h
    # Anchors recorded before tip, in minutes. Defaults match the buckets the
    # backtest graded (docs/RESULTS.md). `opening` (first time an event is seen)
    # and `close` (overwritten on every pre-tip poll, so it ends as the last
    # snapshot before tip) are always recorded. A poll records an anchor once the
    # event is within that many minutes of tip, so the real lead depends on how
    # often you poll; it is stored per row (lead_minutes).
    anchors_minutes_before_tip:
      t-10h: 600
      t-5h: 300
      t-3h: 180
      t-2h: 120
      t-1h: 60
      t-15m: 15
    # An event listed before any book prices it would otherwise trigger an odds
    # call on every poll. An opening-only fetch waits this long after the last one.
    opening_recheck_minutes: 60
    # Refuse to spend credits when the last reported remaining quota is below this.
    min_requests_remaining: 20
  balldontlie:
    per_page: 100
    # Seconds between requests. Set it from your plan's rate limit: 12 s suits a
    # limit of 5 requests a minute.
    min_seconds_between_requests: 12

today:
  # Which stored anchor supplies the market line in the `today` CSV. `close`
  # is the latest pre-tip poll, i.e. the freshest line you have.
  market_anchor: close

models:
  # Settings for the example projectors in nbatotals/model/ (not part of the
  # pre-registered test; see docs/RESULTS.md, "Other projectors").
  elo_total:
    k: 0.05                 # untuned default: points of rating moved per point of total error
    k_grid: [0.01, 0.02, 0.05, 0.1]   # declared grid; fit picks the lowest RMSE on earlier seasons
    season_carry: 0.5       # ratings are multiplied by this at each new season
    league_prior_games: 100 # games of weight on the base league total early in a season
    fallback_total: 222.0   # base league total when no earlier season is available
  # Experiment 2 (docs/experiments/info_latency/PREREGISTRATION.md): pace_eff's formula
  # with each team's pace, offence and defence from that game's projected minutes and
  # player ratings (Dunks & Threes). Needs NBA_LEGACY_DNT and NBA_LEGACY_PLAYER_EPM.
  lineup_pace_eff:
    scale: 1.0                         # untuned default: points per 100 per point of team EPM
    scale_grid: [0.5, 0.75, 1.0, 1.25, 1.5]   # declared grid; fit picks by RMSE on earlier seasons
    shrinkage: 0                       # untuned default: team-games of shrinkage (lambda = n/(n+k); 0 = none)
    shrinkage_grid: [0, 5, 10, 20]     # declared grid
    home_court_total: 2.0              # fixed: pace_eff's fitted value for 2022-23 (from 2021-22 only)
    b2b_total_per_team: 1.0            # fixed: same source
